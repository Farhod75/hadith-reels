name: HadithReels CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_api:
        description: 'Run real API tests against production'
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  test:
    name: Build + Playwright Tests
    # PINNED, NOT `ubuntu-latest` (P314). On 2026-10-19 GitHub began moving the
    # `ubuntu-latest` label to Ubuntu 26.04, choosing the image AT RANDOM per run
    # until 2026-11-19 (actions/runner-images#14748). Playwright 1.60 has no
    # Ubuntu 26 support, so `playwright install` exited 1 before a single test ran
    # and 31 consecutive runs went red without one line of our code changing.
    # A floating label is an undeclared dependency on somebody else's release
    # schedule. Bump this deliberately, after checking the toolchain; never by
    # letting it drift. See OPEN_ITEMS (Tools) for the Playwright ceiling.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
       
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # P043/P045: ONLY mocked tests in CI push
      # language-speech.spec.ts → EXCLUDED (real ElevenLabs calls)
      # Real API tests → manual: npx playwright test --grep @real-api
      - name: Run E2E tests
        run: npx playwright test tests/hadith-reels.spec.ts --reporter=list --workers=1 --project=chromium
        env:
          BASE_URL: https://hadith-reels.vercel.app
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
