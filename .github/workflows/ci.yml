name: HadithReels CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_api:
        description: 'Run real API tests against production'
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  test:
    name: Build + Playwright Tests
    # UNPINNED 2026-10-31, deliberately - which is what the pin's own comment
    # asked for: "Bump this deliberately, after checking the toolchain; never
    # by letting it drift." (P314, P333)
    #
    # The pin was never about the image. It was about the toolchain: Playwright
    # 1.60 had no Ubuntu 26 support, so `playwright install` exited 1 before a
    # single test ran, and 31 consecutive runs went red without one line of our
    # code changing. `@playwright/test` is now 1.64.1, pinned EXACT in
    # package.json, and it carries both images.
    #
    # Evidence taken on 2026-10-31, in its own session and its own push, as
    # OPEN_ITEMS required:
    #   PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu26.04-x64 playwright install
    #     --with-deps chromium --dry-run   ->  exit 0, real linux64 URLs
    #   30/30 E2E pass on 1.60.0 AND on 1.64.1; tsc --noEmit clean on both
    # So whichever image the randomised `ubuntu-latest` label picks now works.
    # The version to watch is in package.json, not here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
       
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # P043/P045: ONLY mocked tests in CI push
      # language-speech.spec.ts → EXCLUDED (real ElevenLabs calls)
      # Real API tests → manual: npx playwright test --grep @real-api
      - name: Run E2E tests
        run: npx playwright test tests/hadith-reels.spec.ts --reporter=list --workers=1 --project=chromium
        env:
          BASE_URL: https://hadith-reels.vercel.app
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
